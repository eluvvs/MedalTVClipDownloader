[package]
name = "medal_clip_downloader"
version = "2.1.2"
edition = "2021"
build = "build.rs"
authors = ["eluvvs <eluvvs@proton.me>"]
description = "Fast, lightweight Medal.TV clip downloader without watermarks"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "default-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
rfd = "0.15"
dirs = "5.0"
html-escape = "0.2"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
